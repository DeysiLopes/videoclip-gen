# cloudbuild.yaml
# CI/CD Pipeline para DreamDirector AI (Frontend + Backend)
# Constrói frontend e backend separadamente com contextos corretos

steps:
  # ============================================================================
  # FRONTEND BUILD
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/frontend:latest'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend/'
    id: 'Build-Frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/frontend:latest'
    id: 'Push-Frontend'

  # ============================================================================
  # BACKEND BUILD
  # ============================================================================
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/backend:latest'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend/'
    id: 'Build-Backend'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/backend:latest'
    id: 'Push-Backend'

  # ============================================================================
  # DEPLOY FRONTEND TO CLOUD RUN
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'videoclip-gen-frontend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/frontend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
    id: 'Deploy-Frontend'

  # ============================================================================
  # DEPLOY BACKEND TO CLOUD RUN
  # ============================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'videoclip-gen-backend'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'
      - '--memory=1Gi'
      - '--timeout=3600'
    id: 'Deploy-Backend'

# Images built
images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/frontend:latest'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/videoclip-gen/backend:latest'

# Options
options:
  logging: CLOUD_LOGGING_ONLY

# Timeout
timeout: '3600s'
