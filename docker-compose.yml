version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: videoclip-gen-frontend
    ports:
      - "3000:8080"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8080
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - videoclip-network

  backend:
    build:
      context: backend/
      dockerfile: Dockerfile
    container_name: videoclip-gen-backend
    ports:
      - "8080:3000"
    volumes:
      - backend-data:/app/data
      - backend-renders:/app/renders
      - backend-tmp:/app/tmp
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped
    # Executar limpeza ao iniciar
    command: sh -c "rm -rf /app/tmp/* /app/renders/* && echo '✅ Diretórios limpos' && node dist/index.js"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - videoclip-network

volumes:
  backend-data:
  backend-renders:
  backend-tmp:

networks:
  videoclip-network:
    driver: bridge

